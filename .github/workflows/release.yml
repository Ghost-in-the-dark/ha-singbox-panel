name: Build and Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tag
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Card
        run: npm run build

      - name: Verify Release Asset
        run: |
          test -f singbox-panel-card.js
          test "$(find . -maxdepth 1 -name 'singbox-panel-card.js' | wc -l)" -eq 1

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: singbox-panel-card.js
