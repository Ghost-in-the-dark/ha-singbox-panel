<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Sing-box Panel Card — test stand</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #121212;
            color: #e1e1e1;
            font-family: Roboto, sans-serif;
        }
        #card {
            max-width: 560px;
            margin: 0 auto;
        }
        /* minimal stand-in for ha-icon used by the card */
        ha-icon {
            display: inline-block;
            width: 22px;
            height: 22px;
            background: currentColor;
            -webkit-mask: var(--stand-icon-mask, none);
            mask: var(--stand-icon-mask, none);
        }
        .log {
            max-width: 560px;
            margin: 16px auto 0;
            font-size: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #8bc34a;
        }
    </style>
    <script>
        // ---- fake ha-icon (renders a simple shape, keeps the card working) ----
        class FakeIcon extends HTMLElement {
            connectedCallback() {
                const shapes = {
                    "mdi:arrow-up-bold": "polygon(50% 0, 100% 60%, 62% 60%, 62% 100%, 38% 100%, 38% 60%, 0 60%)",
                    "mdi:arrow-down-bold": "polygon(50% 100%, 0 40%, 38% 40%, 38% 0, 62% 0, 62% 40%, 100% 40%)",
                    "mdi:arrow-up": "polygon(50% 0, 50% 100%, 50% 100%, 20% 70%, 35% 70%, 35% 100%, 65% 100%, 65% 70%, 80% 70%, 50% 0)",
                    "mdi:arrow-down": "polygon(50% 100%, 50% 0, 50% 0, 80% 30%, 65% 30%, 65% 0, 35% 0, 35% 30%, 20% 30%, 50% 100%)",
                    "mdi:memory": "none",
                    "mdi:lan-connect": "none",
                    "mdi:flash-outline": "polygon(45% 0, 20% 55%, 42% 55%, 35% 100%, 75% 45%, 52% 45%, 65% 0)",
                };
                this.style.setProperty("--stand-icon-mask", shapes[this.icon] || "none");
            }
        }
        customElements.define("ha-icon", FakeIcon);

        // ---- fake HA object ------------------------------------------------
        const entryId = "abc123";
        const states = {
            "sensor.singbox_version": { state: "1.13.18", attributes: {} },
            "sensor.singbox_uplink": { state: "1641", attributes: { unit_of_measurement: "B/s" } },
            "sensor.singbox_downlink": { state: "18234", attributes: { unit_of_measurement: "B/s" } },
            "sensor.singbox_uplink_total": { state: "19.6", attributes: { unit_of_measurement: "MiB" } },
            "sensor.singbox_downlink_total": { state: "0.94", attributes: { unit_of_measurement: "GiB" } },
            "sensor.singbox_memory": { state: "29.9", attributes: { unit_of_measurement: "MiB" } },
            "sensor.singbox_connections_in": { state: "31", attributes: {} },
            "select.telaga_out": { state: "telaga-urltest-out", attributes: { options: ["telaga-1-out", "telaga-2-out", "telaga-urltest-out"] } },
            "select.ru_out": { state: "Ru-2-out", attributes: { options: ["Ru-1-out", "Ru-2-out", "Ru-3-out", "Ru-urltest-out"] } },
            "select.singbox_clash_mode": { state: "Rule", attributes: { options: ["Rule", "Global", "Direct"] } },
            "sensor.telaga_1_out_ping": { state: "180", attributes: { unit_of_measurement: "ms" } },
            "sensor.telaga_2_out_ping": { state: "167", attributes: { unit_of_measurement: "ms" } },
            "sensor.telaga_urltest_out_ping": { state: "180", attributes: { unit_of_measurement: "ms" } },
            "sensor.ru_1_out_ping": { state: "191", attributes: { unit_of_measurement: "ms" } },
            "sensor.ru_2_out_ping": { state: "177", attributes: { unit_of_measurement: "ms" } },
            "sensor.ru_3_out_ping": { state: "139", attributes: { unit_of_measurement: "ms" } },
            "sensor.ru_urltest_out_ping": { state: "191", attributes: { unit_of_measurement: "ms" } },
            "sensor.main_out_ping": { state: "219", attributes: { unit_of_measurement: "ms" } },
            "sensor.eu_out_ping": { state: "160", attributes: { unit_of_measurement: "ms" } },
        };
        const registry = [
            { entity_id: "sensor.singbox_version", platform: "singbox", unique_id: `${entryId}_version` },
            { entity_id: "sensor.singbox_uplink", platform: "singbox", unique_id: `${entryId}_uplink` },
            { entity_id: "sensor.singbox_downlink", platform: "singbox", unique_id: `${entryId}_downlink` },
            { entity_id: "sensor.singbox_uplink_total", platform: "singbox", unique_id: `${entryId}_uplink_total` },
            { entity_id: "sensor.singbox_downlink_total", platform: "singbox", unique_id: `${entryId}_downlink_total` },
            { entity_id: "sensor.singbox_memory", platform: "singbox", unique_id: `${entryId}_memory` },
            { entity_id: "sensor.singbox_connections_in", platform: "singbox", unique_id: `${entryId}_connections_in` },
            { entity_id: "select.telaga_out", platform: "singbox", unique_id: `${entryId}_group_telaga-out` },
            { entity_id: "select.ru_out", platform: "singbox", unique_id: `${entryId}_group_Ru-out` },
            { entity_id: "select.singbox_clash_mode", platform: "singbox", unique_id: `${entryId}_clash_mode` },
            { entity_id: "sensor.telaga_1_out_ping", platform: "singbox", unique_id: `${entryId}_ping_telaga-1-out` },
            { entity_id: "sensor.telaga_2_out_ping", platform: "singbox", unique_id: `${entryId}_ping_telaga-2-out` },
            { entity_id: "sensor.telaga_urltest_out_ping", platform: "singbox", unique_id: `${entryId}_ping_telaga-urltest-out` },
            { entity_id: "sensor.ru_1_out_ping", platform: "singbox", unique_id: `${entryId}_ping_Ru-1-out` },
            { entity_id: "sensor.ru_2_out_ping", platform: "singbox", unique_id: `${entryId}_ping_Ru-2-out` },
            { entity_id: "sensor.ru_3_out_ping", platform: "singbox", unique_id: `${entryId}_ping_Ru-3-out` },
            { entity_id: "sensor.ru_urltest_out_ping", platform: "singbox", unique_id: `${entryId}_ping_Ru-urltest-out` },
            { entity_id: "sensor.main_out_ping", platform: "singbox", unique_id: `${entryId}_ping_main-out` },
            { entity_id: "sensor.eu_out_ping", platform: "singbox", unique_id: `${entryId}_ping_EU-out` },
        ];

        window.__calls = [];
        // Simulates a HA state push: mutates a state in place and re-assigns
        // the hass object (exactly what HA does on every state change).
        window.__pushState = (entityId, newState) => {
            states[entityId] = { ...states[entityId], state: newState };
            const card = document.querySelector("singbox-panel-card");
            if (card) card.hass = window.__fakeHass;
        };
        // Emulates the strict service schema of integration v0.3.8: any call
        // carrying entity_id is rejected (the card must retry without it).
        window.__failOnEntityId = false;
        window.__fakeHass = {
            states,
            async callWS(msg) {
                // deliberately no config_entries/get and no config_entry_id:
                // the card must not depend on them
                if (msg.type === "config/entity_registry/list") {
                    const src = window.__foreignRegistry || registry;
                    return src.map((e) => ({
                        ...e,
                        device_id: window.__registryDeviceId,
                    }));
                }
                throw new Error(`unknown WS call: ${msg.type}`);
            },
            async callService(domain, service, data) {
                if (window.__failOnEntityId && data && data.entity_id) {
                    throw new Error("extra keys not allowed @ data['entity_id']");
                }
                window.__calls.push({ domain, service, data });
            },
        };
        // device_id assigned to every registry entry; the stand switches it to
        // null to emulate a HA where sing-box entities are not linked to the
        // device at all (the user's hard case)
        window.__registryDeviceId = "dev1";
        // optional replacement registry (a "foreign" device with non-singbox
        // entities) used by the card4 scenario
        window.__foreignRegistry = null;
    </script>
</head>
<body>
    <div id="card"></div>
    <div id="card2"></div>
    <div id="card3"></div>
    <div id="card4"></div>

    <script type="module">
        import "../singbox-panel-card.js";

        const card = document.createElement("singbox-panel-card");
        card.setConfig({ title: "Sing-box" });
        document.getElementById("card").appendChild(card);

        // attach the fake hass after a tick so the elements are connected
        await new Promise((r) => setTimeout(r, 50));
        card.hass = window.__fakeHass;

        // second card, pinned to a device (device_id from the HA device URL);
        // created on demand by the test to avoid selector collisions
        window.__addCard2 = () => {
            const card2 = document.createElement("singbox-panel-card");
            card2.setConfig({ title: "Pinned", device_id: "dev1" });
            document.getElementById("card2").appendChild(card2);
            card2.hass = window.__fakeHass;
        };
        // third card: entities NOT linked to any device + a device_id pin that
        // matches nothing -> the card must fall back to whole-registry markers
        // and still render, with a visible warning
        window.__addCard3 = () => {
            window.__registryDeviceId = null;
            const card3 = document.createElement("singbox-panel-card");
            card3.setConfig({ title: "Fallback", device_id: "no-such-device" });
            document.getElementById("card3").appendChild(card3);
            card3.hass = window.__fakeHass;
        };
        // fourth card: the pinned device exists but holds NO sing-box entities
        // (a foreign integration) -> the card must error and list a sample of
        // the records found on that device
        window.__addCard4 = () => {
            window.__registryDeviceId = "other";
            window.__foreignRegistry = [
                { entity_id: "sensor.wg_status", platform: "other", unique_id: "wg_status" },
                { entity_id: "sensor.wg_rx_bytes", platform: "other", unique_id: "wg_rx" },
                { entity_id: "binary_sensor.wg_connected", platform: "other", unique_id: "wg_conn" },
            ];
            const card4 = document.createElement("singbox-panel-card");
            card4.setConfig({ title: "Foreign", device_id: "other" });
            document.getElementById("card4").appendChild(card4);
            card4.hass = window.__fakeHass;
        };
    </script>
</body>
</html>
